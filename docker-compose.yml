services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MERAKI_BASE_URL: ${MERAKI_BASE_URL:-https://api.meraki.com/api/v1}
      MERAKI_CLIENT_LOOKBACK_SECONDS: ${MERAKI_CLIENT_LOOKBACK_SECONDS:-86400}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-25}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-2}
      DATA_DIR: /tmp/meraki-dashboard
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_random_long_string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
    expose:
      - "8000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - meraki_private

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "0.0.0.0:5500:80"
    depends_on:
      - backend
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=16m
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    networks:
      - meraki_private

networks:
  meraki_private:
    driver: bridge
